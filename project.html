<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>پروژه | استودیو هش</title>
  <script>
    (function () {
      function clean(value) {
        return String(value || '').replace(/^\/+|\/+$/g, '').trim();
      }
      var slug = null;
      try {
        slug = clean(new URLSearchParams(location.search).get('slug'));
      } catch (err) {}
      if (!slug) {
        var hash = (location.hash || '').replace(/^#/, '');
        if (hash.indexOf('slug=') === 0) slug = clean(hash.slice(5));
        else if (hash && hash.indexOf('=') === -1) slug = clean(hash);
      }
      location.replace(slug ? '/project/' + encodeURIComponent(slug) + '/' : '/projects.html');
    })();
  </script>
</head>
<body>
  <p><a href="/projects.html">انتقال به پروژه‌ها…</a></p>
</body>
</html>
