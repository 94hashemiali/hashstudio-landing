<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>مقاله | استودیو هش</title>
</head>
<body>
  <p><a id="legacy-article-link" href="/blog.html">انتقال به مقاله یا بلاگ…</a></p>
  <script>
    (function () {
      function clean(value) {
        return String(value || '').replace(/^\/+|\/+$/g, '').trim();
      }
      var slug = null;
      try {
        slug = clean(new URLSearchParams(location.search).get('slug'));
      } catch (err) {}
      if (!slug) {
        var hash = (location.hash || '').replace(/^#/, '');
        if (hash.indexOf('slug=') === 0) slug = clean(hash.slice(5));
        else if (hash && hash.indexOf('=') === -1) slug = clean(hash);
      }
      var dest = slug ? '/article/' + encodeURIComponent(slug) + '/' : '/blog.html';
      var link = document.getElementById('legacy-article-link');
      if (link) link.setAttribute('href', dest);
      location.replace(dest);
    })();
  </script>
</body>
</html>
